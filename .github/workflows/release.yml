name: Release

# Publishes a GitHub Release with the MSI whenever a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build release bundle
        run: npm run tauri build -- --bundles msi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/msi/*.msi
          body_path: docs/RELEASE_NOTES.md
          # 直接发布而非建草稿。草稿只有有推送权限的人看得见 —— v0.1.0 到
          # v0.3.1 四个版本都因此躺在草稿里从未公开，匿名访客打开 releases
          # 页面看到的是"There aren't any releases here"，README 里那句
          # "Download the .msi below" 对所有人都是失效的。
          draft: false
          generate_release_notes: false
