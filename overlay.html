<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SysScope OSD</title>
  </head>
  <body>
    <div class="panel" data-tauri-drag-region>
      <span class="item" data-tauri-drag-region>
        <span class="v fps-v" id="osd-fps">--</span>
      </span>
      <span class="sep" data-tauri-drag-region></span>
      <span class="item" data-tauri-drag-region>
        <span class="k cpu">CPU</span>
        <span class="v" id="osd-cpu">--</span>
      </span>
      <span class="sep" data-tauri-drag-region></span>
      <span class="item" data-tauri-drag-region>
        <span class="k gpu">GPU</span>
        <span class="v" id="osd-gpu">--</span>
      </span>
      <span class="sep" data-tauri-drag-region></span>
      <span class="item" data-tauri-drag-region>
        <span class="k mem" data-i18n="osd.mem">内存</span>
        <span class="v" id="osd-mem">--</span>
      </span>
      <span class="sep" data-tauri-drag-region></span>
      <span class="item" data-tauri-drag-region>
        <span class="k net" data-i18n="osd.net">网络</span>
        <span class="v" id="osd-net">--</span>
      </span>
    </div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
