[package]
name = "sysscope"
version = "0.2.0"
description = "Windows 系统状态实时监控工具"
authors = ["okami.520@gmail.com"]
edition = "2021"

[lib]
name = "sysscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
# 跨 crate 内联与死代码消除，显著缩减体积并提升采样热路径性能。
# panic 保持 unwind：采样线程的 catch_unwind 看门狗依赖它自愈
lto = "fat"
codegen-units = 1
strip = "symbols"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
nvml-wrapper = "0.10"
wmi = "0.14"
ferrisetw = "1"
libloading = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
webview2-com = "0.38"
# 与 webview2-com 0.38 内部同版本，用于 COM 接口 cast（windows 0.58 的
# Interface trait 与之不通用）
windows-core = "0.61"
chrono = "0.4"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Globalization",
    "Win32_System_Registry",
    "Win32_NetworkManagement_Ndis",
] }
